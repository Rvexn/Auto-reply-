<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Reels Mini App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%; padding: 15px;
            z-index: 100; display: flex; justify-content: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .official-btn {
            background: rgba(255, 255, 255, 0.2); color: #fff; text-decoration: none;
            padding: 10px 20px; border-radius: 30px; font-size: 14px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .video-container {
            height: 100vh; width: 100vw; scroll-snap-type: y mandatory;
            overflow-y: scroll; scrollbar-width: none;
        }
        .video-container::-webkit-scrollbar { display: none; }

        .video-section {
            height: 100vh; width: 100vw; scroll-snap-align: start;
            position: relative; background: #000;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.2); font-size: 1.2rem; font-weight: bold;
            pointer-events: none; z-index: 5;
        }

        .overlay {
            position: absolute; bottom: 50px; left: 15px; right: 15px; z-index: 10;
        }
        .title-tag {
            background: rgba(0, 0, 0, 0.5); padding: 5px 12px; border-radius: 4px;
            color: #fff; margin-bottom: 15px; display: inline-block;
            border-left: 3px solid #00f2ea;
        }
        .share-btn {
            background: linear-gradient(45deg, #00f2ea, #ff0050); color: white;
            border: none; padding: 14px 30px; border-radius: 50px;
            font-weight: bold; width: 100%; max-width: 280px; cursor: pointer;
        }

        #loader {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; text-align: center; z-index: 200;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="https://t.me/+vVBirV_wlTNiOTE1" class="official-btn" target="_blank">📢 Official Telegram Group</a>
    </div>

    <div id="loader">🚀 Loading 10 Fresh Reels...</div>
    <div class="video-container" id="feed"></div>

    <script>
        const API_TOKEN = '8520530495:AAEKUzFaC6hTY-elk19iDoC_TTDcgeQtGcc';
        const SHARE_LINK = "https://t.me/share/url?url=https://t.me/Vairal_tv_Bot";

        async function initApp() {
            try {
                // Hum offset -100 le rahe hain taaki pichle messages mein se videos mil sakein
                const response = await fetch(`https://api.telegram.org/bot${API_TOKEN}/getUpdates?limit=100`);
                const data = await response.json();
                
                if (data.ok) {
                    // Sirf wahi messages lein jisme video ho
                    let videoMessages = data.result
                        .filter(m => m.message && m.message.video)
                        .reverse(); // Newest first

                    // Unique videos filter (agar same video bar bar aa rahi ho)
                    const uniqueVideos = [];
                    const map = new Map();
                    for (const item of videoMessages) {
                        if(!map.has(item.message.video.file_id)){
                            map.set(item.message.video.file_id, true);
                            uniqueVideos.push(item);
                        }
                    }

                    // Sirf Top 10 lein
                    renderVideos(uniqueVideos.slice(0, 10));
                }
            } catch (e) {
                document.getElementById('loader').innerHTML = "❌ Connection Error";
            }
        }

        async function renderVideos(videos) {
            const feed = document.getElementById('feed');
            const loader = document.getElementById('loader');
            
            if (videos.length === 0) {
                loader.innerHTML = "No videos found. <br> Please send videos to your bot first!";
                return;
            }

            loader.style.display = 'none';

            for (let i = 0; i < videos.length; i++) {
                const fileId = videos[i].message.video.file_id;
                
                // Get File Path
                const fileRes = await fetch(`https://api.telegram.org/bot${API_TOKEN}/getFile?file_id=${fileId}`);
                const fileData = await fileRes.json();
                
                if(fileData.ok) {
                    const videoUrl = `https://api.telegram.org/file/bot${API_TOKEN}/${fileData.result.file_path}`;

                    const section = document.createElement('div');
                    section.className = 'video-section';
                    section.innerHTML = `
                        <video loop playsinline onclick="this.muted = !this.muted; this.play();">
                            <source src="${videoUrl}" type="video/mp4">
                        </video>
                        <div class="watermark">@Vairal_tv_bot</div>
                        <div class="overlay">
                            <div class="title-tag">Title ${i + 1}</div><br>
                            <button class="share-btn" onclick="window.open('${SHARE_LINK}')">SHARE WITH FRIENDS</button>
                        </div>
                    `;
                    feed.appendChild(section);
                }
            }
            setupAutoPlay();
        }

        function setupAutoPlay() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (entry.isIntersecting) {
                        video.play().catch(() => {
                            video.muted = true;
                            video.play();
                        });
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, { threshold: 0.8 });

            document.querySelectorAll('.video-section').forEach(s => observer.observe(s));
        }

        initApp();
    </script>
</body>
</html>
