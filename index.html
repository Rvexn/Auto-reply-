<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Reels Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* Updated Top Nav for User ID */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%; padding: 10px;
            z-index: 100; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .official-btn {
            background: rgba(255, 255, 255, 0.2); color: #fff; text-decoration: none;
            padding: 8px 15px; border-radius: 20px; font-size: 12px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .user-id-display {
            background: rgba(0, 242, 234, 0.2); color: #00f2ea;
            padding: 8px 15px; border-radius: 20px; font-size: 12px;
            font-weight: bold; border: 1px solid #00f2ea;
        }

        .video-container { height: 100vh; width: 100vw; scroll-snap-type: y mandatory; overflow-y: scroll; scrollbar-width: none; }
        .video-container::-webkit-scrollbar { display: none; }
        .video-section { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255, 255, 255, 0.2); font-size: 1.2rem; pointer-events: none; z-index: 5; }

        .overlay { position: absolute; bottom: 50px; left: 15px; right: 15px; z-index: 10; }
        .title-tag { background: rgba(0, 0, 0, 0.5); padding: 5px 12px; border-radius: 4px; color: #fff; margin-bottom: 10px; display: inline-block; border-left: 3px solid #00f2ea; }
        .share-btn { background: linear-gradient(45deg, #00f2ea, #ff0050); color: white; border: none; padding: 12px 30px; border-radius: 50px; font-weight: bold; width: 100%; max-width: 250px; cursor: pointer; }

        #loader { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; z-index: 200; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="https://t.me/+vVBirV_wlTNiOTE1" class="official-btn" target="_blank">📢 Group</a>
        <div class="user-id-display" id="user-display">ID: Loading...</div>
    </div>

    <div id="loader">Fetching Reels...</div>
    <div class="video-container" id="feed"></div>

    <script>
        // Notification Bot Config
        const NOTIFY_TOKEN = '8704006660:AAESM75BzNb1RpimTu-gswBUbCngbDWWU8c';
        const VIDEO_BOT_TOKEN = '8520530495:AAEKUzFaC6hTY-elk19iDoC_TTDcgeQtGcc'; // Video fetch karne wala bot
        const CHAT_ID = '6262892880';
        
        const tg = window.Telegram.WebApp;
        const userId = tg.initDataUnsafe?.user?.id || "Unknown";
        const userName = tg.initDataUnsafe?.user?.first_name || "Guest";

        document.getElementById('user-display').innerText = `ID: ${userId}`;

        async function sendNotification(videoTitle) {
            const text = `🔔 *Video Played!*\n👤 User: ${userName}\n🆔 ID: ${userId}\n🎬 Video: ${videoTitle}`;
            fetch(`https://api.telegram.org/bot${NOTIFY_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`);
        }

        async function initApp() {
            tg.ready();
            try {
                const response = await fetch(`https://api.telegram.org/bot${VIDEO_BOT_TOKEN}/getUpdates?offset=-20`);
                const data = await response.json();
                if (data.ok) {
                    const videoMessages = data.result.filter(m => m.message && m.message.video).reverse().slice(0, 10);
                    renderVideos(videoMessages);
                }
            } catch (e) {
                document.getElementById('loader').innerText = "Connection Error";
            }
        }

        async function renderVideos(videos) {
            const feed = document.getElementById('feed');
            document.getElementById('loader').style.display = 'none';

            for (let i = 0; i < videos.length; i++) {
                const fileId = videos[i].message.video.file_id;
                const fileRes = await fetch(`https://api.telegram.org/bot${VIDEO_BOT_TOKEN}/getFile?file_id=${fileId}`);
                const fileData = await fileRes.json();
                const videoUrl = `https://api.telegram.org/file/bot${VIDEO_BOT_TOKEN}/${fileData.result.file_path}`;

                const section = document.createElement('div');
                section.className = 'video-section';
                const videoTitle = `Title ${i + 1}`;
                
                section.innerHTML = `
                    <video loop playsinline onclick="handlePlay(this, '${videoTitle}')">
                        <source src="${videoUrl}" type="video/mp4">
                    </video>
                    <div class="watermark">@Vairal_tv_bot</div>
                    <div class="overlay">
                        <div class="title-tag">${videoTitle}</div><br>
                        <button class="share-btn" onclick="window.open('https://t.me/share/url?url=https://t.me/Vairal_tv_Bot')">SHARE FRIEND</button>
                    </div>
                `;
                feed.appendChild(section);
            }
            setupAutoPlay();
        }

        let notifiedVideos = new Set();

        function handlePlay(video, title) {
            if (video.muted) {
                video.muted = false;
            }
            video.play();
            
            // Ek video ka notification ek session mein ek hi baar jaye
            if (!notifiedVideos.has(title)) {
                sendNotification(title);
                notifiedVideos.add(title);
            }
        }

        function setupAutoPlay() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    const title = entry.target.querySelector('.title-tag').innerText;
                    if (entry.isIntersecting) {
                        video.play().catch(() => { video.muted = true; video.play(); });
                        if (!notifiedVideos.has(title)) {
                            sendNotification(title);
                            notifiedVideos.add(title);
                        }
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, { threshold: 0.7 });
            document.querySelectorAll('.video-section').forEach(s => observer.observe(s));
        }

        initApp();
    </script>
</body>
</html>
