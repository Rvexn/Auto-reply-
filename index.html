<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Reels Mini App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
        }

        /* Top Header Button */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            z-index: 100;
            display: flex;
            justify-content: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
        }

        .official-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .video-container {
            height: 100vh;
            width: 100vw;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .video-container::-webkit-scrollbar { display: none; }

        .video-section {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            bottom: 40px;
            left: 15px;
            right: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .title-tag {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 12px;
            border-radius: 4px;
            color: #fff;
            margin-bottom: 15px;
            backdrop-filter: blur(5px);
            border-left: 3px solid #00f2ea;
        }

        .share-btn {
            background: linear-gradient(45deg, #00f2ea, #ff0050);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
        }

        #loader {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="https://t.me/+vVBirV_wlTNiOTE1" class="official-btn" target="_blank">
            📢 Official Telegram Group
        </a>
    </div>

    <div id="loader">
        <p>Fetching Reels...</p>
    </div>

    <div class="video-container" id="feed"></div>

    <script>
        const API_TOKEN = '8520530495:AAEKUzFaC6hTY-elk19iDoC_TTDcgeQtGcc';
        const CHAT_ID = '6262892880';
        const SHARE_LINK = "https://t.me/share/url?url=https://t.me/Vairal_tv_Bot";

        async function initApp() {
            try {
                const response = await fetch(`https://api.telegram.org/bot${API_TOKEN}/getUpdates?offset=-20`);
                const data = await response.json();
                
                if (data.ok) {
                    const videoMessages = data.result
                        .filter(m => m.message && m.message.video)
                        .reverse()
                        .slice(0, 10);
                    
                    renderVideos(videoMessages);
                }
            } catch (e) {
                document.getElementById('loader').innerHTML = "Connection Error";
            }
        }

        async function renderVideos(videos) {
            const feed = document.getElementById('feed');
            document.getElementById('loader').style.display = 'none';

            for (let i = 0; i < videos.length; i++) {
                const fileId = videos[i].message.video.file_id;
                const fileResponse = await fetch(`https://api.telegram.org/bot${API_TOKEN}/getFile?file_id=${fileId}`);
                const fileData = await fileResponse.json();
                const videoUrl = `https://api.telegram.org/file/bot${API_TOKEN}/${fileData.result.file_path}`;

                const section = document.createElement('div');
                section.className = 'video-section';
                // Muted attribute hata diya hai taaki sound aaye
                section.innerHTML = `
                    <video loop playsinline onclick="toggleSound(this)">
                        <source src="${videoUrl}" type="video/mp4">
                    </video>
                    <div class="watermark">@Vairal_tv_bot</div>
                    <div class="overlay">
                        <div class="title-tag">Video #${i + 1}</div>
                        <button class="share-btn" onclick="window.open('${SHARE_LINK}')">SHARE WITH FRIENDS</button>
                    </div>
                `;
                feed.appendChild(section);
            }
            setupAutoPlay();
        }

        // Voice enable karne ke liye function
        function toggleSound(video) {
            if (video.muted) {
                video.muted = false;
            } else {
                video.pause(); // Second click par pause kar sakte hain
            }
        }

        function setupAutoPlay() {
            const observerOptions = { threshold: 0.6 };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (entry.isIntersecting) {
                        // Sound ke liye try-catch
                        video.play().catch(() => {
                            // Agar browser block kare toh muted play hoga
                            video.muted = true;
                            video.play();
                        });
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.video-section').forEach(section => {
                observer.observe(section);
            });
        }

        initApp();
    </script>
</body>
</html>
