<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Mini App (Multi-Reshare Feed)</title>

    <!-- 1. Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --trending: #ef4444;
            --reshare: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-frame {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 12px 16px;
            background-color: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .header h2 {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            padding: 8px 16px;
            background-color: var(--card-bg);
            border-bottom: 1px solid #334155;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: var(--bg-color);
            color: var(--text-main);
            outline: none;
            font-size: 0.85rem;
        }

        .screens-container {
            flex: 1;
            position: relative;
            overflow-y: auto;
        }

        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 12px;
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 80px; /* Space for bottom nav */
        }

        .scene.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(100%);
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        /* --- STANDARD CARD (Home Screen) --- */
        .post-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #334155;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .post-card:active {
            transform: scale(0.98);
        }

        .featured-post {
            border: 2px solid var(--primary);
            animation: fadeIn 0.4s ease-in-out;
        }

        .reshared-post {
            border: 2px solid var(--reshare);
            animation: fadeIn 0.4s ease-in-out;
            margin-bottom: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .trending-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--trending);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .reshare-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--reshare);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .section-header {
            font-size: 0.75rem;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .post-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #0f172a;
            display: block;
        }

        .post-content {
            padding: 10px;
        }

        .post-title {
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        /* --- 3-COLUMN GRID UI (Middle Screen) --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .grid-card {
            position: relative;
            aspect-ratio: 1 / 1;
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #334155;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .grid-card:active {
            transform: scale(0.95);
            border-color: var(--primary);
        }

        .grid-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .grid-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.85));
            padding: 4px 6px;
        }

        .grid-title {
            font-size: 0.65rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        /* Buttons Styling */
        .post-buttons {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .btn {
            flex: 1;
            padding: 6px 8px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
        }

        .btn-primary { background-color: var(--primary); color: #fff; }
        .btn-secondary { background-color: #334155; color: var(--text-main); }

        /* --- BOTTOM NAVIGATION BAR UI --- */
        .bottom-nav {
            height: 60px;
            background-color: var(--card-bg);
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 20;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.75rem;
            cursor: pointer;
            flex: 1;
            padding: 8px 0;
            transition: color 0.2s;
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: bold;
        }

        .load-more-btn {
            margin: 8px 0;
            padding: 10px;
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="app-frame">
        <!-- Top Header -->
        <div class="header">
            <h2 id="headerTitle"><i class="fa-solid fa-house"></i> Home Screen</h2>
        </div>

        <!-- Search Box -->
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Search posts..." oninput="searchPosts()">
        </div>

        <!-- App Container -->
        <div class="screens-container">
            <!-- SCENE 1: HOME SCREEN -->
            <div id="homeScene" class="scene active">
                <div id="reshareContainer"></div>
                <div id="trendingSlot"></div>
                <div class="section-header">Regular Home Feeds</div>
                <div id="homePostsContainer" style="display: flex; flex-direction: column; gap: 12px;"></div>
                <button class="load-more-btn" onclick="loadMoreHome()">Load More Posts</button>
            </div>

            <!-- SCENE 2: ALL MIDDLE SCREEN (3-Column Grid View) -->
            <div id="middleScene" class="scene hidden">
                <div class="section-header">Middle Feeds (Tap post to Re-share on Home)</div>
                <div id="middlePostsContainer" class="grid-container"></div>
                <button class="load-more-btn" onclick="loadMoreMiddle()">Load More Posts</button>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <div class="bottom-nav">
            <button class="nav-item active" id="navHome" onclick="showScene('home')">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </button>
            <button class="nav-item" id="navMiddle" onclick="showScene('middle')">
                <i class="fa-solid fa-border-all"></i>
                <span>Middle</span>
            </button>
        </div>
    </div>

    <script>
        // Telegram WebApp Object Initialization
        const tg = window.Telegram?.WebApp;

        // Initialize Telegram WebApp Settings
        if (tg) {
            tg.ready();
            tg.expand(); // Screen height full karne ke liye
            if (tg.setHeaderColor) tg.setHeaderColor('#1e293b');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#0f172a');
        }

        // Native Link Opener for Telegram
        function openLink(url) {
            if (!url) return;
            triggerHaptic();
            if (tg && tg.openLink) {
                tg.openLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        // Haptic Feedback for Native App Feel
        function triggerHaptic() {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        // Data Array (500 Posts)
        const postsData = [];
        for (let i = 1; i <= 500; i++) {
            postsData.push({
                id: i,
                title: `Post #${i}: Direct Media Video & Link Content`,
                image: `https://picsum.photos/300/300?random=${i}`,
                actionLink: `https://example.com/action/${i}`,
                buttonLink: `https://example.com/link/${i}`
            });
        }

        let homeIndex = 0;
        let middleIndex = 0;
        const limitHome = 10;
        const limitMiddle = 21;
        const MAX_RESHARE_LIMIT = 20;

        window.addEventListener('DOMContentLoaded', () => {
            loadResharedPosts();

            document.getElementById('trendingSlot').innerHTML = `
                <div class="post-card featured-post" onclick="openLink('https://example.com/welcome')">
                    <img src="https://picsum.photos/400/180?random=0" class="post-img" alt="Welcome">
                    <div class="post-content">
                        <div class="trending-badge"><i class="fa-solid fa-sparkles"></i> NEW VISITOR SPECIAL</div>
                        <h3 class="post-title">Welcome! Click anywhere on this post to open link.</h3>
                        <div class="post-buttons" onclick="event.stopPropagation()">
                            <button class="btn btn-primary" onclick="openLink('https://example.com/welcome')">
                                <i class="fa-solid fa-play"></i> Open Link
                            </button>
                        </div>
                    </div>
                </div>
            `;

            loadMoreHome();
            loadMoreMiddle();
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'global_reshared_posts_list') {
                loadResharedPosts();
            }
        });

        function createHomeCard(post) {
            return `
                <div class="post-card" onclick="openLink('${post.actionLink}')">
                    <img src="${post.image}" class="post-img" loading="lazy" alt="Post ${post.id}">
                    <div class="post-content">
                        <h3 class="post-title">${post.title}</h3>
                        <div class="post-buttons" onclick="event.stopPropagation()">
                            <button class="btn btn-primary" onclick="openLink('${post.actionLink}')">
                                <i class="fa-solid fa-play"></i> Open
                            </button>
                            <button class="btn btn-secondary" onclick="openLink('${post.buttonLink}')">
                                <i class="fa-solid fa-link"></i> Link
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function createGridCard(post) {
            return `
                <div class="grid-card" onclick="reshareToAllMembers(${post.id})">
                    <img src="${post.image}" class="grid-img" loading="lazy" alt="Post ${post.id}">
                    <div class="grid-overlay">
                        <div class="grid-title">#${post.id} Post</div>
                    </div>
                </div>
            `;
        }

        function loadMoreHome() {
            triggerHaptic();
            const container = document.getElementById('homePostsContainer');
            const nextBatch = postsData.slice(homeIndex, homeIndex + limitHome);
            nextBatch.forEach(post => {
                container.innerHTML += createHomeCard(post);
            });
            homeIndex += limitHome;
        }

        function loadMoreMiddle() {
            triggerHaptic();
            const container = document.getElementById('middlePostsContainer');
            const nextBatch = postsData.slice(middleIndex, middleIndex + limitMiddle);
            nextBatch.forEach(post => {
                container.innerHTML += createGridCard(post);
            });
            middleIndex += limitMiddle;
        }

        function reshareToAllMembers(id) {
            triggerHaptic();
            const post = postsData.find(p => p.id === id);
            if (!post) return;

            let resharedList = [];
            const stored = localStorage.getItem('global_reshared_posts_list');
            if (stored) {
                try { resharedList = JSON.parse(stored); } catch(e) { resharedList = []; }
            }

            const newItem = {
                post: post,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            };

            resharedList.unshift(newItem);

            if (resharedList.length > MAX_RESHARE_LIMIT) {
                resharedList = resharedList.slice(0, MAX_RESHARE_LIMIT);
            }

            localStorage.setItem('global_reshared_posts_list', JSON.stringify(resharedList));
            renderResharedList(resharedList);
            showScene('home');
        }

        function loadResharedPosts() {
            const stored = localStorage.getItem('global_reshared_posts_list');
            if (stored) {
                try {
                    const list = JSON.parse(stored);
                    renderResharedList(list);
                } catch(e) {}
            }
        }

        function renderResharedList(list) {
            const container = document.getElementById('reshareContainer');
            if (!list || list.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = `<div class="section-header" style="margin-bottom:8px;">
                            <span><i class="fa-solid fa-arrows-rotate" style="color:var(--reshare)"></i> RE-SHARED FEEDS (${list.length}/${MAX_RESHARE_LIMIT})</span>
                        </div>`;

            list.forEach((item, index) => {
                const post = item.post;
                html += `
                    <div class="post-card reshared-post" onclick="openLink('${post.actionLink}')">
                        <img src="${post.image}" class="post-img" alt="Re-shared Post #${post.id}">
                        <div class="post-content">
                            <div class="reshare-badge">
                                <i class="fa-solid fa-arrows-rotate"></i> RE-SHARED #${index + 1} (${item.timestamp})
                            </div>
                            <h3 class="post-title">${post.title}</h3>
                            <div class="post-buttons" onclick="event.stopPropagation()">
                                <button class="btn btn-primary" onclick="openLink('${post.actionLink}')">
                                    <i class="fa-solid fa-play"></i> Open Post
                                </button>
                                <button class="btn btn-secondary" onclick="openLink('${post.buttonLink}')">
                                    <i class="fa-solid fa-share-nodes"></i> Link
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        let currentScene = 'home';
        function showScene(sceneName) {
            triggerHaptic();
            const homeScene = document.getElementById('homeScene');
            const middleScene = document.getElementById('middleScene');
            const navHome = document.getElementById('navHome');
            const navMiddle = document.getElementById('navMiddle');
            const headerTitle = document.getElementById('headerTitle');

            if (sceneName === 'home') {
                homeScene.classList.replace('hidden', 'active');
                middleScene.classList.replace('active', 'hidden');
                
                navHome.classList.add('active');
                navMiddle.classList.remove('active');
                headerTitle.innerHTML = '<i class="fa-solid fa-house"></i> Home Screen';
                currentScene = 'home';
            } else {
                middleScene.classList.replace('hidden', 'active');
                homeScene.classList.replace('active', 'hidden');
                
                navMiddle.classList.add('active');
                navHome.classList.remove('active');
                headerTitle.innerHTML = '<i class="fa-solid fa-border-all"></i> Middle Screen Grid';
                currentScene = 'middle';
            }
        }

        function searchPosts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = postsData.filter(p => p.title.toLowerCase().includes(query));

            if (currentScene === 'home') {
                const container = document.getElementById('homePostsContainer');
                container.innerHTML = '';
                filtered.slice(0, 15).forEach(post => container.innerHTML += createHomeCard(post));
            } else {
                const container = document.getElementById('middlePostsContainer');
                container.innerHTML = '';
                filtered.slice(0, 21).forEach(post => container.innerHTML += createGridCard(post));
            }
        }
    </script>
</body>
</html>
