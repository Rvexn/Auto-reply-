<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Reels Hub</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--tg-theme-bg-color, #0f1016);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: #181922;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        @media (min-width: 480px) {
            .container {
                height: 85vh;
                border-radius: 16px;
                overflow: hidden;
            }
        }

        /* Video Feed Area */
        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Top-Right Logo/Watermark */
        .top-right-logo {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: url('https://i.ibb.co/0pMdvHNQ/IMG-20260819-070400-843.jpg');
            background-size: cover;
            background-position: center;
            z-index: 20;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Bottom-Right Logo (Copy of top-right) */
        .bottom-right-logo {
            position: absolute;
            bottom: 15px;
            right: 45px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: url('https://i.ibb.co/0pMdvHNQ/IMG-20260819-070400-843.jpg');
            background-size: cover;
            background-position: center;
            z-index: 20;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Watermark in the middle */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.15);
            pointer-events: none;
            z-index: 5;
            letter-spacing: 2px;
            text-transform: uppercase;
            user-select: none;
        }

        /* Iframe with audio & autoplay permissions */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }

        /* Overlay Info */
        .video-info {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            z-index: 10;
            pointer-events: none;
        }

        .video-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Navigation Controls */
        .nav-controls {
            position: absolute;
            right: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 15;
        }

        .nav-btn {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Ad Popup Modal */
        #ad-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }

        .ad-box {
            background: #252836;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 320px;
            position: relative;
        }

        .ad-box h3 {
            margin-bottom: 15px;
            color: #ff5722;
        }

        .ad-box p {
            font-size: 14px;
            margin-bottom: 20px;
            color: #b2b2b2;
        }

        #close-ad-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        #close-ad-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Video Player using Iframe with permissions -->
        <div class="video-container" id="player-wrapper">
            
            <!-- Clickable Logos -->
            <div class="top-right-logo" id="logo-btn-top"></div>
            <div class="bottom-right-logo" id="logo-btn-bottom"></div>

            <iframe id="reel-player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            
            <!-- Watermark Text in Middle -->
            <div class="watermark">TG - @Vairal_tv_bot</div>

            <div class="video-info">
                <div class="video-title" id="v-title">Loading...</div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn" id="prev-btn" title="Previous Video">▲</button>
                <button class="nav-btn" id="next-btn" title="Next Video">▼</button>
            </div>
        </div>

        <!-- Ad Screen Overlay -->
        <div id="ad-modal">
            <div class="ad-box">
                <h3>Sponsored Ad</h3>
                <p>Please support us by viewing this ad. You can continue in <span id="countdown">5</span> seconds.</p>
                <button id="close-ad-btn" disabled>Wait 5s...</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Send Telegram Notification
        function sendTelegramNotification() {
            const botToken = "8704006660:AAESM75BzNb1RpimTu-gswBUbCngbDWWU8c";
            const chatId = "6262892880";
            const user = tg.initDataUnsafe.user || { id: "Unknown", username: "Unknown", first_name: "Unknown" };
            const message = `New Visitor!\nName: ${user.first_name}\nUsername: @${user.username}\nUser ID: ${user.id}`;
            
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
            .catch(err => console.error("Notification failed", err));
        }

        // Run notification on load
        sendTelegramNotification();

        // Common function for logo click
        const openYT = () => {
            const youtubeUrl = "https://www.profitableratecpmnetwork.com/ese22rset?key=0bdd4b7fc8c9324f4ec7f161bce720ed";
            if (tg && tg.openLink) {
                tg.openLink(youtubeUrl);
            } else {
                window.open(youtubeUrl, '_blank');
            }
        };

        // Logo click events
        document.getElementById('logo-btn-top').addEventListener('click', openYT);
        document.getElementById('logo-btn-bottom').addEventListener('click', openYT);

        // Array of 10 Embed URLs
        const videos = [
            { title: "Video Reel #1", url: "https://kamareels2.com/embed/6995" },
            { title: "Video Reel #2", url: "https://kamareels2.com/embed/7582" },
            { title: "Video Reel #3", url: "https://kamareels2.com/embed/8189" },
            { title: "Video Reel #4", url: "https://kamareels2.com/embed/6945" },
            { title: "Video Reel #5", url: "https://kamareels2.com/embed/8025" },
            { title: "Video Reel #6", url: "https://kamareels2.com/embed/7252" },
            { title: "Video Reel #7", url: "https://kamareels2.com/embed/328" },
            { title: "Video Reel #8", url: "https://kamareels2.com/embed/8105" },
            { title: "Video Reel #9", url: "https://kamareels2.com/embed/8089" },
            { title: "Video Reel #10", url: "https://kamareels2.com/embed/6993" }
        ];

        // Aapka Direct Ad Link
        const directAdLink = "https://www.profitableratecpmnetwork.com/ese22rset?key=0bdd4b7fc8c9324f4ec7f161bce720ed";

        let currentIndex = parseInt(localStorage.getItem('last_video_index')) || 0;
        let completedVideosCount = parseInt(localStorage.getItem('completed_count')) || 0;

        const videoPlayer = document.getElementById('reel-player');
        const videoTitle = document.getElementById('v-title');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const adModal = document.getElementById('ad-modal');
        const closeAdBtn = document.getElementById('close-ad-btn');
        const countdownSpan = document.getElementById('countdown');

        // Load specific video index
        function loadVideo(index) {
            if (index < 0) index = videos.length - 1;
            if (index >= videos.length) index = 0;

            currentIndex = index;
            localStorage.setItem('last_video_index', currentIndex);

            videoPlayer.src = videos[currentIndex].url;
            videoTitle.innerText = videos[currentIndex].title;
        }

        function playNext() {
            completedVideosCount++;
            localStorage.setItem('completed_count', completedVideosCount);

            // Har 2 videos ke baad ad trigger hoga
            if (completedVideosCount % 2 === 0) {
                triggerAd();
            } else {
                moveToNextVideo();
            }
        }

        function moveToNextVideo() {
            currentIndex = (currentIndex + 1) % videos.length;
            loadVideo(currentIndex);
        }

        function playPrev() {
            currentIndex = (currentIndex - 1 + videos.length) % videos.length;
            loadVideo(currentIndex);
        }

        // Trigger Ad Interstitial with timer
        function triggerAd() {
            adModal.style.display = 'flex';
            
            let timeLeft = 5;
            closeAdBtn.disabled = true;
            closeAdBtn.innerText = `Wait ${timeLeft}s...`;

            let timer = setInterval(() => {
                timeLeft--;
                countdownSpan.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    closeAdBtn.disabled = false;
                    closeAdBtn.innerText = "Continue to Next Video";
                }
            }, 1000);
        }

        // Close Ad Handler
        closeAdBtn.addEventListener('click', () => {
            if (tg && tg.openLink) {
                tg.openLink(directAdLink);
            } else {
                window.open(directAdLink, '_blank');
            }
            
            adModal.style.display = 'none';
            moveToNextVideo();
        });

        // Manual controls
        nextBtn.addEventListener('click', playNext);
        prevBtn.addEventListener('click', playPrev);

        // Initialize player with saved state
        window.addEventListener('DOMContentLoaded', () => {
            loadVideo(currentIndex);
        });
    </script>
</body>
</html>
