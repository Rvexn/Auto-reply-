    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0e1621; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* Header UI */
        .chat-header {
            background-color: #17212b;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #000;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .bot-info { display: flex; align-items: center; gap: 10px; }
        .bot-avatar {
            width: 40px; height: 40px;
            background: linear-gradient(45deg, #2aabee, #229ed9);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold;
        }
        .bot-name { color: white; font-size: 16px; font-weight: 500; }
        .bot-status { color: #6ab3f3; font-size: 12px; }

        .official-link {
            color: #6ab3f3; text-decoration: none; font-size: 13px;
            border: 1px solid #6ab3f3; padding: 4px 10px; border-radius: 15px;
        }

        /* Chat Body */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: overlay;
            scroll-behavior: smooth;
            padding-bottom: 100px;
        }

        .message-bubble {
            max-width: 85%;
            background-color: #182533;
            border-radius: 12px 12px 12px 0px;
            padding: 4px;
            position: relative;
            align-self: flex-start;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .image-wrapper {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-image { width: 100%; display: block; height: auto; max-height: 400px; object-fit: cover; }

        .bubble-info {
            padding: 2px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-title { color: #fff; font-size: 14px; font-weight: 500; }
        .msg-time { color: #7f91a4; font-size: 10px; margin-left: 10px; }

        /* Open Flezen Button Styles */
        .flezen-btn {
            background-color: #24313f;
            color: #6ab3f3;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            display: block;
            margin: 4px;
            border: 1px solid #2f3e4e;
            transition: background 0.2s ease;
        }

        .flezen-btn:active {
            background-color: #2b394a;
        }

        #chat-loader { color: #7f91a4; text-align: center; margin-top: 20px; font-size: 14px; }

        .w-mark {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        /* Invite Footer (WhatsApp Theme) */
        .invite-footer {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            padding: 20px 15px;
            background: linear-gradient(to top, #0e1621 80%, transparent);
            display: flex;
            justify-content: center;
            z-index: 1000;
        }

        .invite-btn {
            background: linear-gradient(45deg, #25d366, #128c7e); /* WhatsApp Green Gradient */
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            animation: pulse-effect 2s infinite;
            cursor: pointer;
            width: 80%;
        }

        @keyframes pulse-effect {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>

        // WhatsApp Redirection Function
        function shareToWhatsApp() {
            const botLink = 'https://t.me/Vairal_tv_Bot';
            const shareText = `Dosto! Yeh kamaal ka bot check karo! Yahan sab fresh updates milti hain 🔥\n\n👉 Bot Link: ${botLink}`;
            
            // WhatsApp universal sharing URL format
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
            
            // Telegram app compatibility safe redirect
            if (tg.openLink) {
                tg.openLink(whatsappUrl);
            } else {
                window.open(whatsappUrl, '_blank');
            }
        }

        async function notifyVisit() {
            const msg = `🚀 *New Visitor!*\n👤 Name: ${userName}\n🆔 ID: ${userId}\n📂 Status: Watching Fresh Playlist`;
            fetch(`https://api.telegram.org/bot${NOTIFY_BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);
        }

        function loadPlaylist() {
            const chatBox = document.getElementById('chat-box');
            document.getElementById('chat-loader').remove();

            if (playlistData.length === 0) {
                chatBox.innerHTML = "<div id='chat-loader'>No updates found.</div>";
                return;
            }

            playlistData.forEach((item, i) => {
                const now = new Date();
                const time = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.id = `msg-${i}`;
                
                bubble.innerHTML = `
                    <div class="image-wrapper">
                        <img src="${item.imageUrl}" class="chat-image" alt="Image" oncontextmenu="return false;">
                        <div class="w-mark">@Vairal_tv_bot</div>
                    </div>
                    <div class="bubble-info">
                        <span class="item-title">${item.title}</span>
                        <span class="msg-time">${time}</span>
                    </div>
                    <a href="${item.redirectUrl}" class="flezen-btn" target="_blank">
                        🔗 Open Flizen
                    </a>
                `;
                chatBox.appendChild(bubble);
            });
        }

        tg.ready();
        tg.expand(); 
        notifyVisit();
        loadPlaylist();
