<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Chat Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0e1621; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* Header UI */
        .chat-header {
            background-color: #17212b;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #101921;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .bot-info { display: flex; align-items: center; gap: 10px; }
        .bot-avatar {
            width: 40px; height: 40px;
            background: linear-gradient(45deg, #2aabee, #229ed9);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold;
        }
        .bot-name { color: white; font-size: 16px; font-weight: 500; }
        .bot-status { color: #6ab3f3; font-size: 12px; }

        .official-link {
            color: #6ab3f3; text-decoration: none; font-size: 13px;
            border: 1px solid #6ab3f3; padding: 4px 10px; border-radius: 15px;
        }

        /* Chat Body */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 0px; /* Pure screen utilize karne ke liye padding 0 ki hai */
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: overlay;
            scroll-behavior: smooth;
            padding-bottom: 120px;
        }

        /* Full Screen UI updates (100% Width) */
        .message-bubble {
            width: 100%; /* Pure screen par stretch hoga */
            max-width: 100%;
            background-color: #131c26; /* Video ke piche premium slate look */
            border-radius: 0px; /* Side edges zero taaki genuine player UI lage */
            padding: 0px;
            position: relative;
            align-self: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-decoration: none;
            display: block;
        }
        
        /* Video Container Setup - Hard 16:9 Aspect Ratio */
        .video-wrapper {
            width: 100%;
            border-radius: 0px; 
            overflow: hidden;
            background: #000;
            position: relative;
            aspect-ratio: 16/9; /* Perfect Cinema layout matching */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-video-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .bubble-info {
            padding: 12px 15px; /* Title aur time ke liye clear space */
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #17212b;
        }
        .item-title { color: #fff; font-size: 15px; font-weight: 500; }
        .msg-time { color: #7f91a4; font-size: 11px; margin-left: 10px; }

        #chat-loader { color: #7f91a4; text-align: center; margin-top: 30px; font-size: 14px; }

        .w-mark {
            position: absolute;
            top: 15px; right: 15px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 2;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
            white-space: nowrap;
        }

        /* Invite Footer */
        .invite-footer {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            padding: 20px 15px;
            background: linear-gradient(to top, #0e1621 85%, transparent);
            display: flex;
            justify-content: center;
            z-index: 1000;
        }

        .invite-btn {
            background: linear-gradient(45deg, #00f2ea, #2aabee);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0, 242, 234, 0.4);
            animation: pulse-effect 2s infinite;
            cursor: pointer;
            width: 90%;
        }

        @keyframes pulse-effect {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body oncontextmenu="return false;"> 
    <div class="chat-header">
        <div class="bot-info">
            <div class="bot-avatar">V</div>
            <div>
                <div class="bot-name">Vairal TV Bot</div>
                <div class="bot-status" id="user-id-top">Connecting...</div>
            </div>
        </div>
        <a href="https://t.me/+RGMEMPF44LViMDRl" class="official-link" target="_blank">Join Group</a>
    </div>

    <div class="chat-container" id="chat-box">
        <div id="chat-loader">Bot is typing...</div>
    </div>

    <div class="invite-footer">
        <button class="invite-btn" onclick="shareToFriends()">
            ➕ Share Friends
        </button>
    </div>
<div id="premium-popup" style="
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background-color: rgba(0, 0, 0, 0.85); 
    z-index: 99999; 
    justify-content: center; 
    align-items: center;
    font-family: Arial, sans-serif;
">
    <div style="
        background-color: #fff; 
        padding: 30px; 
        border-radius: 10px; 
        text-align: center; 
        max-width: 400px; 
        width: 90%;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
    ">
        <h2 style="color: #1a73e8; margin-top: 0;">Premium Video </h2>
        <p style="color: #333; font-size: 16px; margin-bottom: 25px;">
           * Premium Connect join *.
        </p>
        <a href="https://t.me/+RGMEMPF44LViMDRl" style="
            display: inline-block; 
            background-color: #1a73e8; 
            color: white; 
            padding: 12px 24px; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 5px;
            transition: background 0.3s;
        " onmouseover="this.style.backgroundColor='#1557b0'" onmouseout="this.style.backgroundColor='#1a73e8'">
            Join Premium Group 🔞
        </a>
    </div>
</div>

<script>
    // 24 seconds = 24000 milliseconds
    const displayInterval = 24000; 
    const popup = document.getElementById('premium-popup');

    setInterval(function() {
        // Popup ko show karne ke liye
        popup.style.display = 'flex';
    }, displayInterval);
        const NOTIFY_BOT_TOKEN = '8704006660:AAESM75BzNb1RpimTu-gswBUbCngbDWWU8c';
        const CHAT_ID = '6262892880';

        const tg = window.Telegram.WebApp;
        const userId = tg.initDataUnsafe?.user?.id || "Unknown";
        const userName = tg.initDataUnsafe?.user?.first_name || "Guest";

        document.getElementById('user-id-top').innerText = `ID: ${userId}`;

        const playlistData = [
            {
                title: "Viral Video Part 1",
                embedUrl: "https://kamareels2.com/embed/6995"
            },
            {
                title: "Viral Video Part 2",
                embedUrl: "https://kamareels2.com/embed/8189"
            },
            {
                title: "Viral Video Part 3",
                embedUrl: "https://kamareels2.com/embed/7582"
            },
            {
                title: "Viral Video Part 4",
                embedUrl: "https://kamareels2.com/embed/6945"
            },
            {
                title: "Viral Video Part 5",
                embedUrl: "https://kamareels2.com/embed/8025"
            },
            {
                title: "Viral Video Part 6",
                embedUrl: "https://kamareels2.com/embed/7252"
            },
            {
                title: "Viral Video Part 7",
                embedUrl: "https://kamareels2.com/embed/328"
            },
            {
                title: "Viral Video Part 8",
                embedUrl: "https://kamareels2.com/embed/8105"
            },
            {
                title: "Viral Video Part 9",
                embedUrl: "https://kamareels2.com/embed/8176"
            },
            {
                title: "Viral Video Part 10",
                embedUrl: "https://kamareels2.com/embed/8091"
            },
            {
                title: "Viral Video Part 11",
                embedUrl: "https://kamareels2.com/embed/8089"
            },
            {
                title: "Viral Video Part 12",
                embedUrl: "https://kamareels2.com/embed/6993"
            },
            {
                title: "Viral Video Part 12",
                embedUrl: "https://kamareels2.com/embed/8149"
            }
        ];

        function shareToFriends() {
            const botLink = 'https://t.me/Vairal_tv_Bot';
            const shareText = 'Dosto! Yeh bot check karo! 🔥';
            const telegramShareUrl = `https://t.me/share/url?url=${encodeURIComponent(botLink)}&text=${encodeURIComponent(shareText)}`;
            
            if (tg.openTelegramLink) {
                tg.openTelegramLink(telegramShareUrl);
            } else {
                window.open(telegramShareUrl, '_blank');
            }
        }

        async function notifyVisit() {
            const msg = `🚀 *New Visitor!*\n👤 Name: ${userName}\n🆔 ID: ${userId}\n📂 Status: Watching Fresh Playlist`;
            fetch(`https://api.telegram.org/bot${NOTIFY_BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);
        }

        function loadPlaylist() {
            const chatBox = document.getElementById('chat-box');
            document.getElementById('chat-loader').remove();

            if (playlistData.length === 0) {
                chatBox.innerHTML = "<div id='chat-loader'>No updates found.</div>";
                return;
            }

            playlistData.forEach((item, i) => {
                const now = new Date();
                const time = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.id = `msg-${i}`;
                
                bubble.innerHTML = `
                    <div class="video-wrapper">
                        <iframe src="${item.embedUrl}" class="chat-video-frame" allowfullscreen scrolling="no" allow="autoplay; encrypted-media"></iframe>
                        <div class="w-mark">@Vairal_tv_bot</div>
                    </div>
                    <div class="bubble-info">
                        <span class="item-title">${item.title}</span>
                        <span class="msg-time">${time}</span>
                    </div>
                `;
                chatBox.appendChild(bubble);
            });
        }

        tg.ready();
        tg.expand(); 
        notifyVisit();
        loadPlaylist(); 
    </script>
</body>
</html>
