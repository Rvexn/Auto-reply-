<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vairal TV - Premium UI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0e1621; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .chat-header {
            background-color: #17212b;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #232e3c;
            z-index: 100;
        }
        .bot-info { display: flex; align-items: center; gap: 12px; }
        .bot-avatar {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #2aabee, #229ed9);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 18px;
        }
        .bot-name { color: white; font-size: 15px; font-weight: 600; }
        .bot-status { color: #6ab3f3; font-size: 11px; }

        .official-link {
            background-color: #2481cc;
            color: white; text-decoration: none; font-size: 12px;
            padding: 6px 14px; border-radius: 20px; font-weight: 500;
        }

        /* Chat Body */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #0e1621;
            padding-bottom: 100px;
        }

        .message-bubble {
            max-width: 90%;
            background-color: #182533;
            border-radius: 15px;
            overflow: hidden;
            align-self: flex-start;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #232e3c;
        }
        
        .video-wrapper {
            width: 100%;
            position: relative;
            background: #000;
        }

        video { width: 100%; display: block; max-height: 450px; outline: none; }
        
        .playing { border: 2px solid #2b9ed9; }

        .bubble-info {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c2938;
        }
        .video-title { color: #fff; font-size: 13px; font-weight: 500; }
        .msg-time { color: #7f91a4; font-size: 10px; }

        .w-mark {
            position: absolute;
            bottom: 40px; right: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            pointer-events: none;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Loader */
        #chat-loader { 
            color: #7f91a4; 
            text-align: center; 
            margin: auto; 
            font-size: 14px; 
        }

        /* Footer */
        .invite-footer {
            position: fixed;
            bottom: 0; width: 100%;
            padding: 15px;
            background: #17212b;
            border-top: 1px solid #232e3c;
            display: flex; justify-content: center;
        }

        .invite-btn {
            background: #2481cc;
            color: white; border: none;
            padding: 14px; border-radius: 12px;
            font-weight: bold; font-size: 15px;
            cursor: pointer; width: 100%;
            transition: 0.2s;
        }
        .invite-btn:active { transform: scale(0.98); }

    </style>
</head>
<body> 
    <div class="chat-header">
        <div class="bot-info">
            <div class="bot-avatar">V</div>
            <div>
                <div class="bot-name">Vairal TV Bot</div>
                <div class="bot-status" id="user-status">Online</div>
            </div>
        </div>
        <a href="https://t.me/your_group_link" class="official-link">Join Group</a>
    </div>

    <div class="chat-container" id="chat-box">
        <div id="chat-loader">Searching for latest videos...</div>
    </div>

    <div class="invite-footer">
        <button class="invite-btn" onclick="shareToFriends()">
            SHARE WITH FRIENDS
        </button>
    </div>

    <script>
        // API CONFIG (Replace with your actual working tokens)
        const VIDEO_BOT_TOKEN = '8520530495:AAEKJLhLC50Eo3IEJZ8jihJLoTWyP-Lizy8';
        const NOTIFY_BOT_TOKEN = '8704006660:AAESM75BzNb1RpimTu-gswBUbCngbDWWU8c';
        const CHAT_ID = '6262892880';

        const tg = window.Telegram.WebApp;
        tg.expand();

        function shareToFriends() {
            const botUrl = "https://t.me/Vairal_tv_Bot";
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=${encodeURIComponent("Check out these viral videos! 🔥")}`);
        }

        async function loadVideos() {
            const chatBox = document.getElementById('chat-box');
            try {
                // IMPORTANT: getUpdates works only if the bot received messages recently
                const response = await fetch(`https://api.telegram.org/bot${VIDEO_BOT_TOKEN}/getUpdates`);
                const data = await response.json();
                
                if (data.ok && data.result.length > 0) {
                    const videoMsgs = data.result.filter(m => m.message && m.message.video).reverse();
                    
                    if(videoMsgs.length === 0) {
                        showError("No videos found in recent bot updates.");
                        return;
                    }

                    document.getElementById('chat-loader').remove();
                    
                    for (let i = 0; i < videoMsgs.length; i++) {
                        const fileId = videoMsgs[i].message.video.file_id;
                        createVideoBubble(fileId, i);
                    }
                } else {
                    showError("Please send a video to the bot first!");
                }
            } catch (e) {
                showError("Network Error. Check your token.");
            }
        }

        async function createVideoBubble(fileId, index) {
            const chatBox = document.getElementById('chat-box');
            
            // Get Download URL
            const fileRes = await fetch(`https://api.telegram.org/bot${VIDEO_BOT_TOKEN}/getFile?file_id=${fileId}`);
            const fileData = await fileRes.json();
            
            if(!fileData.ok) return;

            const videoUrl = `https://api.telegram.org/file/bot${VIDEO_BOT_TOKEN}/${fileData.result.file_path}`;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = `
                <div class="video-wrapper">
                    <video id="vid-${index}" controls preload="metadata" poster="">
                        <source src="${videoUrl}" type="video/mp4">
                    </video>
                    <div class="w-mark">@Vairal_tv_bot</div>
                </div>
                <div class="bubble-info">
                    <span class="video-title">Viral Video ${index + 1}</span>
                    <span class="msg-time">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                </div>
            `;
            chatBox.appendChild(bubble);
        }

        function showError(msg) {
            document.getElementById('chat-loader').innerText = msg;
        }

        // Notify and Start
        fetch(`https://api.telegram.org/bot${NOTIFY_BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent("🚀 New User Opened Panel: " + (tg.initDataUnsafe?.user?.first_name || "Guest"))}`);
        
        loadVideos();
    </script>
</body>
</html>
